  <ellipse cx="400" cy="435" rx="46" ry="12" fill="#E5D0A1" stroke="#8A6826" stroke-width="1.5"/>
  <path d="M388 435 V404 H412 V435 M378 404 Q400 392 422 404" fill="#FAF6EE" stroke="#6E511B" stroke-width="1.6"/>
