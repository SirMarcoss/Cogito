  <circle cx="400" cy="242" r="14" fill="#c9a86a" fill-opacity="0.4" stroke="#5b5040" stroke-width="1.5"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#c9a86a" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="400" y="68" text-anchor="middle" fill="#c9a86a" font-family="Georgia, serif" font-size="15" letter-spacing="6">REPERTO MARMOREO • II SEC. D.C.</text>
  <text x="400" y="556" text-anchor="middle" fill="#e4cc9a" font-family="Georgia, serif" font-size="22" font-style="italic">Torso Loricato di Imperatore Romano</text>
