      <stop offset="0%" stop-color="#28231d"/>
      <stop offset="65%" stop-color="#121110"/>
      <stop offset="100%" stop-color="#09090a"/>
    </radialGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3eee4"/>
      <stop offset="55%" stop-color="#cfc5b4"/>
      <stop offset="100%" stop-color="#8c806d"/>
