  <text x="400" y="68" text-anchor="middle" fill="#c9a86a" font-family="Georgia, serif" font-size="15" letter-spacing="6">PINACOTECA DIOCESANA • CATANIA</text>
  <text x="400" y="548" text-anchor="middle" fill="#e4cc9a" font-family="Georgia, serif" font-size="22" font-style="italic">Martirio di Sant&apos;Agata (XVII secolo)</text>
