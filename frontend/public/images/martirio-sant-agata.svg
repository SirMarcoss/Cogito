      <stop offset="0%" stop-color="#e4cc9a" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#5c2121" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#0b090a"/>
    </radialGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8c262b"/>
