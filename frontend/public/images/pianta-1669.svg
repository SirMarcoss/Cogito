<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="parchment" cx="50%" cy="50%" r="68%">
      <stop offset="0%" stop-color="#362c20"/>
      <stop offset="70%" stop-color="#221b14"/>
      <stop offset="100%" stop-color="#14100c"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#parchment)"/>
  <!-- Cartographic grid -->
  <g stroke="#c9a86a" stroke-opacity="0.16" stroke-width="1">
    <line x1="160" y1="40" x2="160" y2="560"/>
    <line x1="320" y1="40" x2="320" y2="560"/>
    <line x1="480" y1="40" x2="480" y2="560"/>
    <line x1="640" y1="40" x2="640" y2="560"/>
    <line x1="40" y1="150" x2="760" y2="150"/>
    <line x1="40" y1="300" x2="760" y2="300"/>
    <line x1="40" y1="450" x2="760" y2="450"/>
  </g>
  <!-- Etna slope & 1669 lava flow branching around city walls -->
  <path d="M90 130 Q210 190 275 265 T420 350 Q485 378 555 415 L635 475" fill="none" stroke="#c84c2b" stroke-width="28" stroke-linecap="round" opacity="0.45"/>
  <path d="M90 130 Q210 190 275 265 T420 350 Q485 378 555 415 L635 475" fill="none" stroke="#e4cc9a" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- City bastion walls & Ursino marker -->
  <polygon points="360,265 510,250 565,335 475,410 355,365" fill="#17130f" fill-opacity="0.7" stroke="#c9a86a" stroke-width="2.5"/>
  <circle cx="430" cy="340" r="14" fill="#c9a86a" fill-opacity="0.3" stroke="#e4cc9a" stroke-width="2"/>
  <circle cx="430" cy="340" r="4" fill="#e4cc9a"/>
  <text x="452" y="344" fill="#e4cc9a" font-family="Georgia, serif" font-size="13">Castellum Ursini</text>
  <!-- Compass rose -->
  <g transform="translate(650 135)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#c9a86a" stroke-opacity="0.6" stroke-width="1.2"/>
    <polygon points="0,-36 7,-7 36,0 7,7 0,36 -7,7 -36,0 -7,-7" fill="none" stroke="#e4cc9a" stroke-width="1.4"/>
    <text x="0" y="-44" text-anchor="middle" fill="#e4cc9a" font-family="Georgia, serif" font-size="12">N</text>
  </g>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#c9a86a" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="400" y="68" text-anchor="middle" fill="#c9a86a" font-family="Georgia, serif" font-size="15" letter-spacing="6">ARCHIVIO STORICO • FONDO MAPPE 1669</text>
  <text x="400" y="548" text-anchor="middle" fill="#e4cc9a" font-family="Georgia, serif" font-size="22" font-style="italic">Pianta della Colata Lavica del 1669</text>
